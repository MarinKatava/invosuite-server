spring:
  application:
    name: invoisuite-server
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:invoisuite}
    password: ${DB_PASSWORD:invoisuite}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

invoisuite:
  jwt:
    secret: ${JWT_SECRET:change-this-development-only-secret-key-please-32bytes+}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  google:
    client-id: ${GOOGLE_CLIENT_ID:replace-with-your-google-oauth-web-client-id.apps.googleusercontent.com}
  security:
    # Encrypts stored third-party credentials (e.g. Odoo API keys). Use a long random value
    # in production and keep it stable: changing it makes stored credentials unreadable.
    encryption-key: ${ENCRYPTION_KEY:change-this-development-only-encryption-key}
  integrations:
    # Both default to false: only public https servers may be contacted. Enable for local dev only.
    allow-private-hosts: ${ALLOW_PRIVATE_HOSTS:false}
    allow-insecure-http: ${ALLOW_INSECURE_HTTP:false}
